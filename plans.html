<!-- Form section -->
<section id="#checkout" class="py-5">
  <div class="container">
    <h2 class="text-center mb-4 featuresText" style="color:var(--accent);">Join Our Gym</h2>
    <form class="p-4 rounded border-form">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Your name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" placeholder="01xx-xxx-xxxx" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" placeholder="Street, City" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"> Email Address</label>
          <input type="email" class="form-control" placeholder="xxxxxxxx@gmail.com" required>
        </div>
        <div class="col-12">
          <label class="form-label d-block">Payment Method</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="paymentMethod" id="cash" value="cash" checked>
            <label class="form-check-label" for="cash">Cash at Gym</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="paymentMethod" id="online" value="online">
            <label class="form-check-label" for="online">Online Payment</label>
          </div>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-accent px-4 py-2 buutonHero">Submit</button>
        </div>
      </div>
    </form>
  </div>
</section>

<script src="plans.js"></script>
