<!-- Form section -->
<section id="#checkout" class="py-5">
  <div class="container">
    <h2 class="text-center mb-4 featuresText" style="color:var(--accent);">Join Our Gym</h2>
    <form class="p-4 rounded border-form">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Your name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" placeholder="01xx-xxx-xxxx" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" placeholder="Street, City" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"> Email Address</label>
          <input type="email" class="form-control" placeholder="xxxxxxxx@gmail.com" required>
        </div>
        <div class="col-12">
          <label class="form-label d-block">Payment Method</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="paymentMethod" id="cash" value="cash" checked>
            <label class="form-check-label" for="cash">Cash at Gym</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="paymentMethod" id="online" value="online">
            <label class="form-check-label" for="online">Online Payment</label>
          </div>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-accent px-4 py-2 buutonHero">Submit</button>
        </div>
      </div>
    </form>
  </div>
</section>

<script src="plans.js"></script>
<script src="script.js"></script>
<script>
    // test reviews
   const testimonials = [
    {
      message: "Great gym! I saw amazing results in just 2 months.",
      name: "Ahmed Youssef",
      program: "Weight Loss Program"
    },
    {
      message: "The trainers are super supportive and motivating. I love it here!",
      name: "Sarah Ali",
      program: "Ladies Program"
    },
    {
      message: "Best physiotherapy service I've tried. My recovery was fast and smooth.",
      name: "Mohamed Hassan",
      program: "Advanced Physiotherapy Plan"
    },
    {
      message: "The environment is clean and the equipment is top-notch!",
      name: "Omar Ibrahim",
      program: "Muscle Building Program"
    },
    {
      message: "Amazing experience! The annual plan saved me a lot of money.",
      name: "Mona Adel",
      program: "Annual All-Inclusive"
    }
  ];

  let currentTestimonial = 0;
  const container = document.getElementById("testimonialContainer");
  const messageEl = document.getElementById("testimonialMessage");
  const nameEl = document.getElementById("testimonialName");
  const programEl = document.getElementById("testimonialProgram");

  function showTestimonial(index) {
    const t = testimonials[index];
    messageEl.textContent = `"${t.message}"`;
    nameEl.textContent = `– ${t.name}`;
    programEl.textContent = t.program;
  }

  function cycleTestimonials() {
    container.classList.remove("fade-in");
    container.classList.add("fade-out");

    setTimeout(() => {
      currentTestimonial = (currentTestimonial + 1) % testimonials.length;
      showTestimonial(currentTestimonial);
      container.classList.remove("fade-out");
      container.classList.add("fade-in");
    }, 500);
  }

  // أول رأي
  showTestimonial(currentTestimonial);

  // تغيير تلقائي كل 15 ثانية
  setInterval(cycleTestimonials, 7000);
</script>
</body>
